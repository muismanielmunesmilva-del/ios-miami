name: miami-xnu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'miami/**'
      - '!miami/**/*.md'
      - '!miami/probe/results/**'
      - '!miami/xnu/reference-stage.json'
      - 'xnu/patches/**'
      - 'tools/adt.py'
      - 'tools/mkpayload.py'
      - 'tools/mkinit.py'
      - 'shim/font.h'
      - '.github/workflows/miami-xnu.yml'

permissions:
  contents: read

concurrency:
  group: miami-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host and loader tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler
      - name: Fetch pinned read-only libfdt source
        run: |
          git init -q "$RUNNER_TEMP/dtc"
          git -C "$RUNNER_TEMP/dtc" fetch -q --depth 1 https://github.com/dgibson/dtc.git 54e547173bf0f2a4cc35eba8b5738caf38b9230f
          git -C "$RUNNER_TEMP/dtc" checkout -q FETCH_HEAD
      - name: Validate loader bounds, ADT and reservation failures
        run: python3 miami/tests/check.py --dtc "$RUNNER_TEMP/dtc"
      - name: Validate bootstrap assembly and final splash mappings
        run: python3 miami/tests/check-console.py
      - name: Fetch pinned source for staging checks
        run: |
          git init -q "$RUNNER_TEMP/xnu-check/xnu"
          git -C "$RUNNER_TEMP/xnu-check/xnu" fetch -q --depth 1 https://github.com/apple-oss-distributions/xnu.git refs/tags/xnu-8796.141.3
          git -C "$RUNNER_TEMP/xnu-check/xnu" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/xnu-check/helper"
          git -C "$RUNNER_TEMP/xnu-check/helper" fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build.git 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C "$RUNNER_TEMP/xnu-check/helper" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/xnu-check/pthread"
          git -C "$RUNNER_TEMP/xnu-check/pthread" fetch -q --depth 1 https://github.com/apple-oss-distributions/libpthread.git a6c70ca0e544347a0377babf748f831577ec24f9
          git -C "$RUNNER_TEMP/xnu-check/pthread" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/xnu-check/bearssl"
          git -C "$RUNNER_TEMP/xnu-check/bearssl" fetch -q --depth 1 https://github.com/status-im/BearSSL.git 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          git -C "$RUNNER_TEMP/xnu-check/bearssl" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/xnu-check/hfs"
          git -C "$RUNNER_TEMP/xnu-check/hfs" fetch -q --depth 1 https://github.com/apple-oss-distributions/hfs.git 31d5ec238dfab485e78a9a30b8b92d13e8914f03
          git -C "$RUNNER_TEMP/xnu-check/hfs" checkout -q FETCH_HEAD
      - name: Validate target source edits and early console compilation
        run: python3 miami/tests/check-source.py --source "$RUNNER_TEMP/xnu-check/xnu" --helper "$RUNNER_TEMP/xnu-check/helper" --pthread "$RUNNER_TEMP/xnu-check/pthread" --bearssl "$RUNNER_TEMP/xnu-check/bearssl" --hfs "$RUNNER_TEMP/xnu-check/hfs"
      - name: Check pinned Apple restore manifest provenance
        run: |
          python3 tools/remotezip.py 'https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw' BuildManifest.plist "$RUNNER_TEMP/ios-manifest"
          python3 miami/userspace/inspect_ipsw.py "$RUNNER_TEMP/ios-manifest/BuildManifest.plist"
      - name: Validate Mach-O CodeDirectory page verifier
        run: python3 miami/tests/check-codesign-pages.py
      - name: Validate Miami UFS driver invariants
        run: python3 miami/tests/check-ufs.py
      - name: Validate Miami Display, HID, Keys, and USB subsystems
        run: |
          python3 miami/tests/check-display.py
          python3 miami/tests/check-hid.py
          python3 miami/tests/check-keys.py
          python3 miami/tests/check-usb.py

  kernel:
    needs: validate
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      MACOS_VERSION: '13.5'
      ARCH_CONFIG: ARM64
      MACHINE_CONFIG: MIAMI
      KERNEL_CONFIG: DEVELOPMENT
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Xcode and install dependencies
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee toolchain.txt
          grep -q '^Xcode 16.4$' toolchain.txt
          xcrun --find iig | tee -a toolchain.txt
          xcrun clang --version >> toolchain.txt
          sw_vers >> toolchain.txt
          brew install jq gum bash cmake ninja
      - name: Fetch pinned helper and Apple kernel
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build.git 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          git init -q dxb/xnu
          git -C dxb/xnu fetch -q --depth 1 https://github.com/apple-oss-distributions/xnu.git refs/tags/xnu-8796.141.3
          git -C dxb/xnu checkout -q FETCH_HEAD
          test "$(git -C dxb/xnu rev-parse HEAD)" = 1b191cb58250d0705d8a51287127505aa4bc0789
          git init -q dxb/pthread
          git -C dxb/pthread fetch -q --depth 1 https://github.com/apple-oss-distributions/libpthread.git a6c70ca0e544347a0377babf748f831577ec24f9
          git -C dxb/pthread checkout -q FETCH_HEAD
          test "$(git -C dxb/pthread rev-parse HEAD)" = a6c70ca0e544347a0377babf748f831577ec24f9
          git init -q dxb/bearssl
          git -C dxb/bearssl fetch -q --depth 1 https://github.com/status-im/BearSSL.git 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          git -C dxb/bearssl checkout -q FETCH_HEAD
          test "$(git -C dxb/bearssl rev-parse HEAD)" = 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f
          git init -q dxb/hfs
          git -C dxb/hfs fetch -q --depth 1 https://github.com/apple-oss-distributions/hfs.git 31d5ec238dfab485e78a9a30b8b92d13e8914f03
          git -C dxb/hfs checkout -q FETCH_HEAD
          test "$(git -C dxb/hfs rev-parse HEAD)" = 31d5ec238dfab485e78a9a30b8b92d13e8914f03
          python3 miami/xnu/configure-helper.py dxb
          echo "MIAMI_PORT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Build single-CPU MIAMI kernel
        working-directory: dxb
        shell: bash
        run: |
          set -o pipefail
          if bash build.sh > ../miami-build.log 2>&1; then
            tail -n 30 ../miami-build.log
          else
            tail -n 160 ../miami-build.log
            python3 "$GITHUB_WORKSPACE/miami/xnu/summarize-errors.py" ../miami-build.log
            exit 1
          fi
      - name: Verify and collect kernel
        run: |
          exec > >(tee collect.log) 2>&1
          mkdir -p out
          KERNEL=dxb/fakeroot/System/Library/Kernels/kernel.development.miami
          test -s "$KERNEL"
          xcrun lipo -info "$KERNEL" | tee out/architecture.txt
          xcrun otool -hv "$KERNEL" >> out/architecture.txt
          xcrun nm -U "$KERNEL" > "$RUNNER_TEMP/pthread-symbols.txt"
          for symbol in _pthread_start _pthread_internal_functions __pthread_init __psynch_mutexwait _workq_setup_thread; do
            grep -E "[[:space:]]${symbol}$" "$RUNNER_TEMP/pthread-symbols.txt" >> out/pthread-verification.txt
          done
          for symbol in _miami_aes_cbc_encrypt _miami_aes_cbc_decrypt _br_aes_ct_cbcenc_init _br_aes_ct_cbcenc_run _br_aes_ct_cbcdec_init _br_aes_ct_cbcdec_run _MD5Init _MD5Update _MD5Final _br_md5_init _SHA1Init _SHA384_Init _SHA512_Init _br_sha1_init _br_sha384_init _br_sha512_init; do
            grep -E "[[:space:]]${symbol}$" "$RUNNER_TEMP/pthread-symbols.txt" >> out/aes-verification.txt
          done
          for symbol in _mockfs_mountroot _mockfs_fsnode_create _miami_hfs_register _hfs_vfsops _SHA256_Init _ccsha256_ltc_di _miami_amfi_register _miami_amfi_policy_register _miami_entitlements_create _miami_amfi_adjust_without_monitor _miami_sandbox_mac_conf _miami_crash_log; do
            grep -E "[[:space:]]${symbol}$" "$RUNNER_TEMP/pthread-symbols.txt" >> out/ram-root-verification.txt
          done
          cp "$KERNEL" out/
          cp dxb/xnu/libkern/crypto/miami_bearssl/LICENSE.txt out/BearSSL-LICENSE.txt
          python3 miami/userspace/build.py out/miami-init.macho > out/init-verification.json
          python3 miami/userspace/mkhfs.py out/miami-root.hfs --launchd out/miami-init.macho > out/hfs-verification.json
          python3 miami/loader/payload.py "$KERNEL" out/payload.bin --ramdisk out/miami-init.macho
          python3 miami/loader/payload.py "$KERNEL" out/payload-hfs.bin --ramdisk out/miami-root.hfs
          xcrun clang -O2 -Wall -Wextra -Werror -DMIAMI_PAYLOAD_ONLY miami/loader/verify-input.c miami/loader/plan.c -o "$RUNNER_TEMP/check-payload"
          "$RUNNER_TEMP/check-payload" out/payload.bin
          "$RUNNER_TEMP/check-payload" out/payload-hfs.bin
          cp toolchain.txt dxb/miami-source.json out/
          git rev-parse HEAD > out/port-commit.txt
          (cd out && shasum -a 256 kernel.development.miami payload.bin payload.adt payload-hfs.bin payload-hfs.adt miami-init.macho miami-root.hfs > SHA256SUMS)
      - name: Preserve source and generated headers after a build failure
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          for directory in dxb/xnu dxb/fakeroot/usr/local/include dxb/build/xnu.obj; do
            if test -d "$directory"; then printf '%s\n' "$directory" >> ci-diagnostics/paths.txt; fi
          done
          if test -s ci-diagnostics/paths.txt; then
            tar -czf ci-diagnostics/buildtree.tgz --exclude='.git' --exclude='*.o' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' -T ci-diagnostics/paths.txt
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miami-xnu-diagnostics
          path: |
            miami-build.log
            collect.log
            toolchain.txt
            dxb/miami-source.json
            dxb/miami-required-patches/
            ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified kernel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miami-xnu-kernel
          path: out/
          if-no-files-found: error
          retention-days: 7
